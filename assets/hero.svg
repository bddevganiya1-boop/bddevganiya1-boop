<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
<defs>
  <linearGradient id="gp" x1="0" x2="1"><stop offset="0" stop-color="#238636"/><stop offset="1" stop-color="#3fb950"/></linearGradient>
  <pattern id="seg" width="16" height="12" patternUnits="userSpaceOnUse"><rect x="13" width="3" height="12" fill="#0d1117"/></pattern>
</defs>
<style>
  text{font-family:ui-monospace,Menlo,Consolas,'Courier New',monospace;font-size:14px;fill:#c9d1d9}
  .w{fill:#e6edf3}.b{fill:#58a6ff}.g{fill:#3fb950}.d{fill:#8b949e}.bg{fill:#0d1117}
  .h{transform-box:fill-box;transform-origin:left}
  .r{transform-box:fill-box;transform-origin:right}
  .c{transform-box:fill-box;transform-origin:center}
  .in{animation:rise 1s ease-out both}
  .t1{animation:ty 20s steps(39,end) infinite backwards}
  .t2{animation:ty 20s steps(48,end) infinite backwards}
  .bar{animation:fillbar 20s linear infinite backwards}
  .con{animation:con 20s linear infinite backwards}
  .lit{animation:lit 20s linear infinite backwards}
  .blk{animation:pulse 3s ease-in-out infinite}
  .ring{animation:ring 2s ease-out infinite}
  .spin{transform-origin:450px 165px;animation:spin 14s linear infinite}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes ty{0%{transform:scaleX(1)}12%{transform:scaleX(0)}100%{transform:scaleX(0)}}
  @keyframes fillbar{0%{transform:scaleX(0)}15%{transform:scaleX(1)}100%{transform:scaleX(1)}}
  @keyframes con{0%{transform:scaleX(0)}3%{transform:scaleX(1)}100%{transform:scaleX(1)}}
  @keyframes lit{0%{opacity:0}3%{opacity:1}100%{opacity:1}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>

<rect class="bg" width="900" height="500" rx="12" stroke="#30363d"/>

<!-- Title -->
<g class="in">
  <text x="450" y="62" text-anchor="middle" class="w" style="font-size:32px;font-weight:700;letter-spacing:6px">BHAUTIK DEVGANIYA</text>
  <text x="450" y="92" text-anchor="middle" class="b" style="font-size:13px;letter-spacing:4px">DEVOPS ENGINEER / CLOUD / AUTOMATION</text>
</g>

<!-- Docker icon -->
<g class="in" style="animation-delay:.3s">
  <path d="M178 170h64c-2 16-14 24-32 24s-30-8-32-24z" fill="none" stroke="#2496ed" stroke-width="2"/>
  <g fill="#2496ed">
    <rect class="blk" x="184" y="154" width="13" height="12"/>
    <rect class="blk" x="200" y="154" width="13" height="12" style="animation-delay:.4s"/>
    <rect class="blk" x="216" y="154" width="13" height="12" style="animation-delay:.8s"/>
    <rect class="blk" x="200" y="140" width="13" height="12" style="animation-delay:1.2s"/>
  </g>
  <text x="210" y="218" text-anchor="middle" class="w" style="font-size:15px;font-weight:700;letter-spacing:2px">DOCKER</text>
  <text x="210" y="236" text-anchor="middle" class="d" style="font-size:11px">containers</text>
</g>

<!-- Kubernetes icon -->
<g class="in" style="animation-delay:.5s">
  <circle cx="450" cy="165" r="28" fill="none" stroke="#326ce5" stroke-width="2"/>
  <g class="spin" stroke="#326ce5" stroke-width="3" stroke-linecap="round">
    <line x1="450" y1="165" x2="450" y2="145"/>
    <line x1="450" y1="165" x2="450" y2="145" transform="rotate(51 450 165)"/>
    <line x1="450" y1="165" x2="450" y2="145" transform="rotate(103 450 165)"/>
    <line x1="450" y1="165" x2="450" y2="145" transform="rotate(154 450 165)"/>
    <line x1="450" y1="165" x2="450" y2="145" transform="rotate(206 450 165)"/>
    <line x1="450" y1="165" x2="450" y2="145" transform="rotate(257 450 165)"/>
    <line x1="450" y1="165" x2="450" y2="145" transform="rotate(309 450 165)"/>
  </g>
  <circle cx="450" cy="165" r="5" fill="#326ce5"/>
  <text x="450" y="218" text-anchor="middle" class="w" style="font-size:15px;font-weight:700;letter-spacing:2px">KUBERNETES</text>
  <text x="450" y="236" text-anchor="middle" class="d" style="font-size:11px">orchestration</text>
</g>

<!-- Terraform icon -->
<g class="in" style="animation-delay:.7s" fill="#7b42bc">
  <polygon class="blk" points="670,146 684,154 684,172 670,164"/>
  <polygon class="blk" points="687,154 701,162 701,180 687,172" style="animation-delay:.5s"/>
  <polygon class="blk" points="687,136 701,144 701,162 687,154" style="animation-delay:1s"/>
  <polygon class="blk" points="704,145 718,153 718,171 704,163" style="animation-delay:1.5s"/>
  <text x="690" y="218" text-anchor="middle" class="w" style="font-size:15px;font-weight:700;letter-spacing:2px">TERRAFORM</text>
  <text x="690" y="236" text-anchor="middle" class="d" style="font-size:11px">infrastructure as code</text>
</g>

<path d="M40 252H860" stroke="#30363d"/>

<!-- Terminal typing -->
<text x="40" y="282" class="g">bhautik@devganiya:~$ <tspan class="w">cd devops-engineer</tspan></text>
<rect class="bg r t1" x="40" y="267" width="345" height="22" style="animation-delay:.6s"/>

<text x="40" y="310" class="g">bhautik@devganiya:~/devops-engineer$ <tspan class="w">./deploy.sh</tspan></text>
<rect class="bg r t2" x="40" y="295" width="420" height="22" style="animation-delay:3.2s"/>

<!-- Progress bar -->
<rect x="40" y="330" width="740" height="16" rx="3" fill="#161b22" stroke="#30363d"/>
<rect class="h bar" x="42" y="332" width="736" height="12" rx="2" fill="url(#gp)" style="animation-delay:5.8s"/>
<rect x="42" y="332" width="736" height="12" fill="url(#seg)"/>
<text class="g lit" x="800" y="343" style="font-weight:700;animation-delay:8.6s">100%</text>

<!-- Pipeline -->
<g>
  <rect x="99" y="404" width="126" height="2" fill="#30363d"/><rect x="243" y="404" width="126" height="2" fill="#30363d"/>
  <rect x="387" y="404" width="126" height="2" fill="#30363d"/><rect x="531" y="404" width="126" height="2" fill="#30363d"/>
  <rect x="675" y="404" width="126" height="2" fill="#30363d"/>
  <rect class="h con" x="99" y="404" width="126" height="2" fill="#3fb950" style="animation-delay:9.4s"/>
  <rect class="h con" x="243" y="404" width="126" height="2" fill="#3fb950" style="animation-delay:10.2s"/>
  <rect class="h con" x="387" y="404" width="126" height="2" fill="#3fb950" style="animation-delay:11s"/>
  <rect class="h con" x="531" y="404" width="126" height="2" fill="#3fb950" style="animation-delay:11.8s"/>
  <rect class="h con" x="675" y="404" width="126" height="2" fill="#3fb950" style="animation-delay:12.6s"/>
</g>
<g fill="#30363d">
  <circle cx="90" cy="405" r="8"/><circle cx="234" cy="405" r="8"/><circle cx="378" cy="405" r="8"/>
  <circle cx="522" cy="405" r="8"/><circle cx="666" cy="405" r="8"/><circle cx="810" cy="405" r="8"/>
</g>
<g fill="#3fb950">
  <circle class="c lit" cx="90" cy="405" r="8" style="animation-delay:9s"/>
  <circle class="c lit" cx="234" cy="405" r="8" style="animation-delay:9.8s"/>
  <circle class="c lit" cx="378" cy="405" r="8" style="animation-delay:10.6s"/>
  <circle class="c lit" cx="522" cy="405" r="8" style="animation-delay:11.4s"/>
  <circle class="c lit" cx="666" cy="405" r="8" style="animation-delay:12.2s"/>
  <circle class="c lit" cx="810" cy="405" r="8" style="animation-delay:13s"/>
</g>
<g class="lit" style="animation-delay:13s"><circle class="c ring" cx="810" cy="405" r="8" fill="none" stroke="#3fb950" stroke-width="2"/></g>
<g text-anchor="middle" class="d" style="font-size:12px">
  <text class="d" x="90" y="437">SOURCE</text><text class="d" x="234" y="437">BUILD</text><text class="d" x="378" y="437">TEST</text>
  <text class="d" x="522" y="437">DOCKER</text><text class="d" x="666" y="437">K8S</text><text class="d" x="810" y="437">PRODUCTION</text>
</g>

<!-- Footer status -->
<path d="M40 455H860" stroke="#30363d"/>
<g class="lit" style="animation-delay:13.5s">
  <circle class="blk" cx="345" cy="477" r="5" fill="#3fb950"/>
  <text x="360" y="482" class="g" style="font-size:12px;letter-spacing:3px">ALL SYSTEMS OPERATIONAL</text>
</g>
</svg>
