  <rect class="v" x="353" y="430" width="16" height="60" style="animation-delay:.3s;animation-duration:2.1s"/>
  <rect class="v" x="378" y="380" width="16" height="110" fill="#f2cc0c" style="animation-delay:.6s;animation-duration:1.5s"/>
  <rect class="v" x="403" y="415" width="16" height="75" style="animation-delay:.2s;animation-duration:2.3s"/>
  <rect class="v" x="428" y="365" width="16" height="125" fill="#f2cc0c" style="animation-delay:.9s;animation-duration:1.9s"/>
  <rect class="v" x="453" y="395" width="16" height="95" style="animation-delay:.4s;animation-duration:1.6s"/>
  <rect class="v" x="478" y="420" width="16" height="70" style="animation-delay:.7s;animation-duration:2.2s"/>
  <rect class="v" x="503" y="375" width="16" height="115" fill="#f2cc0c" style="animation-delay:.1s;animation-duration:1.8s"/>
  <rect class="v" x="528" y="405" width="16" height="85" style="animation-delay:.5s;animation-duration:2s"/>
  <rect class="v" x="553" y="390" width="16" height="100" style="animation-delay:.8s;animation-duration:1.4s"/>
</g>

<!-- Panel 3: gauge -->
<rect x="600" y="305" width="280" height="210" rx="8" fill="#161b22" stroke="#30363d"/>
<text class="w" x="615" y="332" style="font-size:12px;font-weight:700">UPTIME (30d)</text>
<path d="M675 460A65 65 0 0 1 805 460" fill="none" stroke="#21262d" stroke-width="14" stroke-linecap="round"/>
<path class="draw" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M675 460A65 65 0 0 1 805 460" fill="none" stroke="#73bf69" stroke-width="14" stroke-linecap="round" style="animation-delay:1.5s"/>
<text x="740" y="452" text-anchor="middle" class="g" style="font-size:26px;font-weight:700">99.98%</text>
<text x="740" y="485" text-anchor="middle" class="d" style="font-size:11px;letter-spacing:2px">SLO 99.9%</text>

