  <g class="pop" style="animation-delay:.6s"><rect x="315" y="617" width="270" height="34" rx="6" fill="#0d1117" stroke="#30363d"/><circle cx="333" cy="634" r="5" fill="#d24939"/><text x="349" y="639">Jenkins</text></g>
  <g class="pop" style="animation-delay:.75s"><rect x="590" y="617" width="270" height="34" rx="6" fill="#0d1117" stroke="#30363d"/><circle cx="608" cy="634" r="5" fill="#2088ff"/><text x="624" y="639">GitHub Actions</text></g>
  <g class="pop" style="animation-delay:.9s"><rect x="40" y="659" width="270" height="34" rx="6" fill="#0d1117" stroke="#30363d"/><circle cx="58" cy="676" r="5" fill="#f46800"/><text x="74" y="681">Grafana</text></g>
  <g class="pop" style="animation-delay:1.05s"><rect x="315" y="659" width="270" height="34" rx="6" fill="#0d1117" stroke="#30363d"/><circle cx="333" cy="676" r="5" fill="#e6522c"/><text x="349" y="681">Prometheus</text></g>
  <g class="pop" style="animation-delay:1.2s"><rect x="590" y="659" width="270" height="34" rx="6" fill="#0d1117" stroke="#30363d"/><circle cx="608" cy="676" r="5" fill="#fcc624"/><text x="624" y="681">Linux</text></g>
</g>

