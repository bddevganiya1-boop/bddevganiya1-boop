<svg xmlns="http://www.w3.org/2000/svg" width="900" height="950" viewBox="0 0 900 950">
<defs>
  <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5794f2" stop-opacity=".35"/><stop offset="1" stop-color="#5794f2" stop-opacity="0"/></linearGradient>
  <pattern id="seg" width="16" height="12" patternUnits="userSpaceOnUse"><rect x="13" width="3" height="12" fill="#161b22"/></pattern>
</defs>
<style>
  text{font-family:ui-monospace,Menlo,Consolas,'Courier New',monospace;font-size:14px;fill:#c9d1d9}
  .w{fill:#e6edf3}.b{fill:#58a6ff}.g{fill:#3fb950}.d{fill:#8b949e}
  .h{transform-box:fill-box;transform-origin:left}
  .grow{animation:grow 14s linear infinite backwards}
  .draw{animation:draw 14s linear infinite backwards}
  .area{animation:areaIn 14s linear infinite backwards}
  .line{animation:line 14s linear infinite backwards}
  .pop{animation:pop 14s linear infinite backwards}
  .v{transform-box:fill-box;transform-origin:bottom;animation:bars 1.8s ease-in-out infinite alternate}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes grow{0%{transform:scaleX(0)}20%{transform:scaleX(1)}100%{transform:scaleX(1)}}
  @keyframes draw{0%{stroke-dashoffset:1}25%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
  @keyframes areaIn{0%{opacity:0}25%{opacity:1}100%{opacity:1}}
  @keyframes line{0%{opacity:0;transform:translateX(-10px)}4%{opacity:1;transform:none}100%{opacity:1}}
  @keyframes pop{0%{opacity:0;transform:translateY(6px)}5%{opacity:1;transform:none}100%{opacity:1}}
  @keyframes bars{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes blink{50%{opacity:0}}
</style>

<rect width="900" height="950" rx="12" fill="#0d1117" stroke="#30363d"/>

<!-- INFRASTRUCTURE STATUS -->
<rect x="20" y="15" width="860" height="275" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="450" y="46" text-anchor="middle" class="b" style="font-weight:700;letter-spacing:4px">INFRASTRUCTURE STATUS</text>

<g class="d">
  <text class="d" x="60" y="95">CPU</text>        <path d="M170 91H290" stroke="#30363d" stroke-dasharray="3 4"/>
  <text class="d" x="60" y="130">MEMORY</text>    <path d="M170 126H290" stroke="#30363d" stroke-dasharray="3 4"/>
  <text class="d" x="60" y="165">CONTAINERS</text><path d="M170 161H290" stroke="#30363d" stroke-dasharray="3 4"/>
  <text class="d" x="60" y="200">PODS</text>      <path d="M170 196H290" stroke="#30363d" stroke-dasharray="3 4"/>
  <text class="d" x="60" y="235">PIPELINES</text> <path d="M170 231H290" stroke="#30363d" stroke-dasharray="3 4"/>
  <text class="d" x="60" y="270">UPTIME</text>    <path d="M170 266H290" stroke="#30363d" stroke-dasharray="3 4"/>
</g>
<g fill="#0d1117">
  <rect x="300" y="84" width="380" height="12" rx="2"/><rect x="300" y="119" width="380" height="12" rx="2"/>
  <rect x="300" y="154" width="380" height="12" rx="2"/><rect x="300" y="189" width="380" height="12" rx="2"/>
  <rect x="300" y="224" width="380" height="12" rx="2"/><rect x="300" y="259" width="380" height="12" rx="2"/>
</g>
<rect class="h grow" x="300" y="84"  width="312" height="12" rx="2" fill="#f85149"/>
<rect class="h grow" x="300" y="119" width="243" height="12" rx="2" fill="#d29922" style="animation-delay:.2s"/>
<rect class="h grow" x="300" y="154" width="285" height="12" rx="2" fill="#3fb950" style="animation-delay:.4s"/>
<rect class="h grow" x="300" y="189" width="285" height="12" rx="2" fill="#3fb950" style="animation-delay:.6s"/>
<rect class="h grow" x="300" y="224" width="380" height="12" rx="2" fill="#3fb950" style="animation-delay:.8s"/>
<rect class="h grow" x="300" y="259" width="379" height="12" rx="2" fill="#3fb950" style="animation-delay:1s"/>
<rect x="300" y="84"  width="380" height="12" fill="url(#seg)"/><rect x="300" y="119" width="380" height="12" fill="url(#seg)"/>
<rect x="300" y="154" width="380" height="12" fill="url(#seg)"/><rect x="300" y="189" width="380" height="12" fill="url(#seg)"/>
<rect x="300" y="224" width="380" height="12" fill="url(#seg)"/><rect x="300" y="259" width="380" height="12" fill="url(#seg)"/>
<g class="w" style="font-weight:700">
  <text class="w" x="700" y="95">82%</text><text class="w" x="700" y="130">64%</text>
  <text class="g" x="700" y="165">12 RUNNING</text><text class="g" x="700" y="200">24 RUNNING</text>
  <text class="g" x="700" y="235">08 SUCCESS</text><text class="g" x="700" y="270">99.98%</text>
</g>

<!-- GRAFANA PANELS -->
<!-- Panel 1: time series -->
<rect x="20" y="305" width="280" height="210" rx="8" fill="#161b22" stroke="#30363d"/>
<text class="w" x="35" y="332" style="font-size:12px;font-weight:700">CPU / MEMORY</text>
<rect x="170" y="324" width="10" height="3" fill="#5794f2"/><text class="d" x="185" y="330" style="font-size:11px">cpu</text>
<rect x="225" y="324" width="10" height="3" fill="#ff9830"/><text class="d" x="240" y="330" style="font-size:11px">mem</text>
<g stroke="#21262d"><path d="M35 350H285M35 385H285M35 420H285M35 455H285M35 490H285"/></g>
<path class="area" d="M35 470L65 440L95 455L125 410L155 425L185 385L215 400L245 370L285 380L285 490L35 490Z" fill="url(#ag)" style="animation-delay:1s"/>
<path class="draw" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M35 470L65 440L95 455L125 410L155 425L185 385L215 400L245 370L285 380" fill="none" stroke="#5794f2" stroke-width="2" style="animation-delay:1s"/>
