<text x="450" y="558" text-anchor="middle" class="b" style="font-weight:700;letter-spacing:4px">TECH STACK</text>
<g>
  <g class="pop"><rect x="40" y="575" width="270" height="34" rx="6" fill="#0d1117" stroke="#30363d"/><circle cx="58" cy="592" r="5" fill="#ff9900"/><text x="74" y="597">AWS</text></g>
